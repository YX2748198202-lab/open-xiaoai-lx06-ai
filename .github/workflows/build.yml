name: Build XiaoAI Remix

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device profile'
        required: true
        default: 'lx06'
        type: choice
        options:
          - lx06
          - oh2p
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'install-standalone-ai.sh'
      - 'ai.conf.example'
      - '.github/workflows/build.yml'

permissions:
  contents: read

env:
  LX06_TARGET: armv7-unknown-linux-gnueabihf
  OH2P_TARGET: aarch64-unknown-linux-gnu

jobs:
  build-lx06:
    name: Build LX06 ARMv7
    if: github.event_name == 'push' || github.event.inputs.device == 'lx06'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
          components: rustfmt
      - name: Install cross
        run: cargo install cross --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test host code
        run: cargo test --all
      - name: Build
        run: cross build --release --target armv7-unknown-linux-gnueabihf --bin standalone-ai
      - name: Verify ELF
        run: |
          file target/armv7-unknown-linux-gnueabihf/release/standalone-ai
          test -x target/armv7-unknown-linux-gnueabihf/release/standalone-ai
      - name: Package
        run: |
          rm -rf dist
          mkdir -p dist
          cp target/armv7-unknown-linux-gnueabihf/release/standalone-ai dist/standalone-ai
          cp install-standalone-ai.sh dist/install-standalone-ai.sh
          cp ai.conf.example dist/ai.conf.example
          chmod 755 dist/standalone-ai dist/install-standalone-ai.sh
          tar -czf lx06-standalone-ai.tar.gz -C dist standalone-ai install-standalone-ai.sh ai.conf.example
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lx06-standalone-ai
          path: lx06-standalone-ai.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-oh2p:
    name: Build OH2P AArch64 (experimental)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.device == 'oh2p'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: rustfmt
      - name: Install cross
        run: cargo install cross --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test host code
        run: cargo test --all
      - name: Build
        run: cross build --release --target aarch64-unknown-linux-gnu --bin standalone-ai
      - name: Verify ELF
        run: |
          file target/aarch64-unknown-linux-gnu/release/standalone-ai
          test -x target/aarch64-unknown-linux-gnu/release/standalone-ai
      - name: Package
        run: |
          rm -rf dist
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/standalone-ai dist/standalone-ai
          cp install-standalone-ai.sh dist/install-standalone-ai.sh
          cp ai.conf.example dist/ai.conf.example
          chmod 755 dist/standalone-ai dist/install-standalone-ai.sh
          tar -czf oh2p-standalone-ai.tar.gz -C dist standalone-ai install-standalone-ai.sh ai.conf.example
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oh2p-standalone-ai-experimental
          path: oh2p-standalone-ai.tar.gz
          if-no-files-found: error
          retention-days: 30