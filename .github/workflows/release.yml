name: Release XiaoAI Remix

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-lx06:
    name: Build LX06 ARMv7 release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf
          components: rustfmt

      - name: Install cross
        run: cargo install cross --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test host code
        run: cargo test --all

      - name: Build
        run: cross build --release --target armv7-unknown-linux-gnueabihf --bin standalone-ai

      - name: Verify ELF
        run: |
          file target/armv7-unknown-linux-gnueabihf/release/standalone-ai
          test -x target/armv7-unknown-linux-gnueabihf/release/standalone-ai

      - name: Package
        run: |
          rm -rf dist
          mkdir -p dist
          cp target/armv7-unknown-linux-gnueabihf/release/standalone-ai dist/standalone-ai
          cp install-standalone-ai.sh dist/install-standalone-ai.sh
          cp ai.conf.example dist/ai.conf.example
          chmod 755 dist/standalone-ai dist/install-standalone-ai.sh
          tar -czf xiaoai-remix-lx06-${GITHUB_REF_NAME}.tar.gz \
            -C dist standalone-ai install-standalone-ai.sh ai.conf.example

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-lx06
          path: xiaoai-remix-lx06-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-oh2p:
    name: Build OH2P AArch64 release (experimental)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: rustfmt

      - name: Install cross
        run: cargo install cross --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test host code
        run: cargo test --all

      - name: Build
        run: cross build --release --target aarch64-unknown-linux-gnu --bin standalone-ai

      - name: Verify ELF
        run: |
          file target/aarch64-unknown-linux-gnu/release/standalone-ai
          test -x target/aarch64-unknown-linux-gnu/release/standalone-ai

      - name: Package
        run: |
          rm -rf dist
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/standalone-ai dist/standalone-ai
          cp install-standalone-ai.sh dist/install-standalone-ai.sh
          cp ai.conf.example dist/ai.conf.example
          chmod 755 dist/standalone-ai dist/install-standalone-ai.sh
          tar -czf xiaoai-remix-oh2p-${GITHUB_REF_NAME}-experimental.tar.gz \
            -C dist standalone-ai install-standalone-ai.sh ai.conf.example

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-oh2p
          path: xiaoai-remix-oh2p-${{ github.ref_name }}-experimental.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs:
      - build-lx06
      - build-oh2p
    runs-on: ubuntu-latest
    steps:
      - name: Download LX06 package
        uses: actions/download-artifact@v4
        with:
          name: release-lx06
          path: release-assets

      - name: Download OH2P package
        uses: actions/download-artifact@v4
        with:
          name: release-oh2p
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: XiaoAI Remix ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: release-assets/*.tar.gz