name: Build LX06 Standalone AI

on:
  workflow_dispatch:
  push:
    paths:
      - 'open-xiaoai-lx06-standalone-ai-source.zip'
      - '.github/workflows/build-lx06-standalone-ai.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source package
        shell: bash
        run: |
          rm -rf source
          mkdir -p source
          unzip -q open-xiaoai-lx06-standalone-ai-source.zip -d source
          test -f source/open-xiaoai-main/packages/client-rust/Cargo.toml
          test -f source/open-xiaoai-main/packages/client-rust/src/bin/standalone-ai.rs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Install cross
        run: cargo install cross --locked

      - name: Build ARMv7 standalone-ai
        working-directory: source/open-xiaoai-main/packages/client-rust
        run: |
          cross build --release --target armv7-unknown-linux-gnueabihf --bin standalone-ai

      - name: Verify ELF
        shell: bash
        run: |
          file source/open-xiaoai-main/packages/client-rust/target/armv7-unknown-linux-gnueabihf/release/standalone-ai
          chmod +x source/open-xiaoai-main/packages/client-rust/target/armv7-unknown-linux-gnueabihf/release/standalone-ai

      - name: Package
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          cp source/open-xiaoai-main/packages/client-rust/target/armv7-unknown-linux-gnueabihf/release/standalone-ai dist/standalone-ai
          cp source/open-xiaoai-main/packages/client-rust/install-standalone-ai.sh dist/install-standalone-ai.sh
          cp source/open-xiaoai-main/packages/client-rust/standalone-ai.conf.example dist/ai.conf.example
          tar -czf lx06-standalone-ai.tar.gz -C dist standalone-ai install-standalone-ai.sh ai.conf.example

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lx06-standalone-ai
          path: lx06-standalone-ai.tar.gz
          if-no-files-found: error
          retention-days: 30
